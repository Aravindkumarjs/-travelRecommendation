<html>
<title>Aravind's Travel Recommendation</title>

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="travel.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Travel Recomendation</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about-us.html">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Contact Us</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input id="conditionInput" class="form-control me-2" type="search" placeholder="Search"
                        aria-label="Search">
                    <button id="btnSearch" class="btn btn-success" type="button">Search</button>
                    <button id="btnReset" class="btn btn-primary" type="button">Reset</button>
                </form>
            </div>
        </div>
    </nav>
    <div class="position-relative overflow-hidden   bg-body-tertiary jumbotron  row">
        <div class="col-md-1">
            <div class="d-flex flex-column align-items-center justify-content-center social">
                <a href="#" class="fa fa-facebook"></a>
                <a href="#" class="fa fa-twitter"></a>
                <a href="#" class="fa fa-instagram"></a>
                <a href="#" class="fa fa-youtube"></a>
            </div>

        </div>
        <div class="col-md-5 p-lg-5  my-5 ">
            <div id="main">
                <h1 class="display-3 fw-bold">CONTACT US</h1>
                <form>
                    <div class="mb-3">
                        <label for="exampleInputName" class="form-label">Name</label>
                        <input type="text" class="form-control" id="exampleInputName" aria-describedby="nameHelp">
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                    </div>
                    <div class="form">
                        <label for="floatingTextarea2">Message</label>
                        <textarea class="form-control" id="floatingTextarea2" style="height: 100px"></textarea>

                    </div>

                    <button type="submit" class="btn btn-primary" onclick="alert('Thanks for reaching us out')">Submit</button>
                </form>
            </div>
            <div id="search-result">

            </div>
        </div>

    </div>
</body>
<script src="travel_recommendation.js"></script>

</html>
